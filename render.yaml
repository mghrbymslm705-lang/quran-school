# ملف نشر Render — انشر هذا المستودع مباشرة (Connect a new repository).
# بعد الربط، اضبط المتغيرات البيئية كما أدناه؛ لا حاجة لتغيير أي شيء آخر.
services:
  - type: web
    name: quran-school
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # JWT_SECRET: اضغط "Generate" في لوحة Render لقيمة عشوائية آمنة (يُحفظ ويبقى ثابتًا).
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "212605706006"
      # DATABASE_PATH: مسار ملف SQLite داخل الحاوية. على الخطة المجانية القرص مؤقت
      # فتُفقد البيانات عند إعادة النشر؛ للثبات اربط قرصًا دائمًا واجعل المسار داخله.
      - key: DATABASE_PATH
        value: ./server/school.production.db
      # APP_PUBLIC_URL: اتركه فارغًا ليُشتق تلقائيًا من اسم النطاق المُسند (onrender.com).
      # SEED_DEMO=1: يُنشئ بيانات تجريبية وحساب admin/admin123 عند أول تشغيل فقط (للتجربة).
      # للإنتاج الحقيقي: احذف هذا المتغير وشغّل setup-production بكلمة سر قوية.
      - key: SEED_DEMO
        value: "1"
