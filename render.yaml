# ملف نشر Render — انشر هذا المستودع مباشرة (Connect a new repository).
# بعد الربط، اضبط المتغيرات البيئية كما أدناه؛ لا حاجة لتغيير أي شيء آخر.
services:
  - type: web
    name: quran-school
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node --experimental-sqlite server/scripts/setup-production.js && node --experimental-sqlite server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SETUP_USERNAME
        value: miloud0000
      - key: SETUP_PASSWORD
        value: miloud0000
      - key: WHATSAPP_NUMBER
        value: "212605706006"
      - key: DATABASE_PATH
        value: ./server/school.production.db
